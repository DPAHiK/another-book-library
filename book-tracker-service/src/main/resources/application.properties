spring.application.name=book-tracker-service
server.port=${TRACKER_PORT}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://tracker_db:${TRACKER_DB_PORT}/${TRACKER_DB_NAME}
spring.datasource.username=${TRACKER_DB_USER}
spring.datasource.password=${TRACKER_DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.kafka.bootstrap-servers=kafka:${KAFKA_PORT}
spring.kafka.consumer.group-id=book_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
