services:

  ######## KAFKA ########

  zookeeper:
    container_name: ZOOKEEPER
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEPEER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEPEER_PORT}:${ZOOKEPEER_PORT}"

  kafka:
    container_name: KAFKA
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEPEER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_PORT},PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    container_name: KAFKA_UI
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_PORT}
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:${ZOOKEPEER_PORT}


  ######## MYSQL ########

  mysql:
    container_name: MYSQL
    image: mysql:8.0
    ports:
      - "3307:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_MYSQL_PASS}
      MYSQL_DATABASE: ${TRACKER_DB_NAME}
      MYSQL_USER: ${TRACKER_DB_USER}
      MYSQL_PASSWORD: ${TRACKER_DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh


  ######## TRACKER ########

  tracker:
    container_name: BOOK_TRACKER
    restart: always
    ports:
      - "8081:8080"
    build:
      context: ./book-tracker-service/
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mysql
      - kafka
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/${TRACKER_DB_NAME}


  ######## STORAGE ########

  storage:
    container_name: BOOK_STORAGE
    restart: always
    ports:
      - "8080:8080"
    build:
      context: ./book-storage-service/
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mysql
      - kafka
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/${STORAGE_DB_NAME}


  ######## AUTH ########

  auth:
    container_name: BOOK_AUTH
    restart: always
    ports:
      - "8082:8080"
    build:
      context: ./book-auth-service/
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mysql
      - kafka
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/${AUTH_DB_NAME}


volumes:
  mysql_data:
