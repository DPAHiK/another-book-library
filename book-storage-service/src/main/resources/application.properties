spring.application.name=book-storage-service
server.port=${STORAGE_PORT}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://localhost:${STORAGE_DB_PORT}/${STORAGE_DB_NAME}
spring.datasource.username=${STORAGE_DB_USER}
spring.datasource.password=${STORAGE_DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.kafka.bootstrap-servers=kafka:${KAFKA_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

token.signing.key=${STORAGE_JWT_SIGNING_KEY}