spring.application.name=book-auth-service
server.port=8080
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://mysql:$3306/${AUTH_DB_NAME}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.kafka.bootstrap-servers=kafka:${KAFKA_PORT}
spring.kafka.consumer.group-id=book_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

token.signing.key=${JWT_SIGNING_KEY}
